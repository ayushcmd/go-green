[package]
name = "sandbox-manager"
version = "0.1.0"
edition = "2021"
authors = ["ayushcmd <ayush_24a12res897@iitp.ac.in>"]
description = "GoGreen Secure Sandbox Supervisor for Controlled Linux Execution"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
uuid = { version = "1.15", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.17"
