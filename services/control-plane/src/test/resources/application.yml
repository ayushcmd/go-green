server:
  port: 0

spring:
  application:
    name: gogreen-control-plane-test
  datasource:
    url: jdbc:h2:mem:gogreen_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false # Hibernate ddl-auto manages schema for tests

mesh:
  nats:
    enabled: false
  coordinator:
    grpc:
      port: 0
      heartbeat-timeout-seconds: 10
      worker-heartbeat-interval-seconds: 3
      tls:
        enabled: false
    partition:
      default-name: "partition-test"
